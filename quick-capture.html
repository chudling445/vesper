<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#0b0d12" /><title>Vesper Quick Capture</title><link rel="stylesheet" href="/styles.css" /></head><body class="capture-page" data-theme="riko"><main class="capture-shell"><header class="capture-head"><a class="brand-lockup" href="/"><span class="brand-emblem">V</span><span><b>VESPER</b><small>QUICK CAPTURE</small></span></a><button id="capture-minimize" class="icon-button" type="button" aria-label="Close quick capture">×</button></header><div class="capture-kicker"><span class="live-pip"></span> INBOX / READY TO RECEIVE</div><h1>Drop it in.<br /><em>Keep moving.</em></h1><div class="capture-types" role="tablist"><button class="is-active" data-capture-type="note" type="button">NOTE</button><button data-capture-type="voice" type="button">VOICE NOTE</button><button data-capture-type="link" type="button">WEB LINK</button><button data-capture-type="image" type="button">IMAGE LINK</button></div><form id="quick-capture-form"><label class="studio-field">TITLE<input id="quick-title" maxlength="140" placeholder="What do you want to remember?" autofocus /></label><label class="studio-field" id="quick-body-label">CONTENT<textarea id="quick-body" rows="5" maxlength="4000" placeholder="Type, paste, or drop a clipping here…"></textarea></label><div class="capture-drop" id="capture-drop" tabindex="0"><span>⇩</span><b>Drop text, links, or files here</b><small>Paste from anywhere · Ctrl/Cmd + Shift + Space opens this widget</small></div><div class="form-row"><label class="studio-field">CATEGORY<select id="quick-category"><option>Personal</option><option>Work</option><option>Shopping</option><option>Family</option></select></label><label class="studio-field">DUE DATE<input id="quick-due" type="date" /></label></div><div class="capture-foot"><span id="capture-status">Nothing saved yet</span><button class="primary-button" type="submit">SAVE TO INBOX <span>↵</span></button></div></form><p class="capture-note">Vesper saves this on your device first. Open <a href="/workspace">Workspace</a> to sort, schedule, and share it.</p></main><script type="module" src="/quick-capture.js"></script></body></html>
